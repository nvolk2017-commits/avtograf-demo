<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Автограф">
<meta name="theme-color" content="#07140f">
<title>Автограф-сессия с ИИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  html,body{margin:0;height:100%;background:#07140f;color:#f1ece2;overflow:hidden;color-scheme:dark}
  #stage{position:absolute;left:50%;top:50%;transform-origin:0 0}
  #themes{position:fixed;right:14px;bottom:12px;display:flex;gap:6px;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;z-index:5}
  #themes button{all:unset;cursor:pointer;padding:7px 10px;border-radius:14px;color:rgba(241,236,226,.55);border:1px solid rgba(241,236,226,.18)}
  #themes button.on{color:#f1ece2;border-color:rgba(241,236,226,.6)}
  #themes button:focus-visible{outline:2px solid #c9a466;outline-offset:2px}
  /* полный экран / режим стойки: панель прячется; три быстрых касания в левом верхнем углу — показать её снова */
  body.kiosk #themes{display:none}
  #corner{position:fixed;left:0;top:0;width:90px;height:90px;z-index:6}
  #toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);max-width:min(92vw,520px);padding:12px 16px;border-radius:12px;
    background:rgba(7,20,15,.92);border:1px solid rgba(201,164,102,.5);color:#f1ece2;font:400 14px/1.4 "Golos Text",Arial,sans-serif;text-align:center;z-index:7;opacity:0;pointer-events:none;transition:opacity .3s}
  #toast.on{opacity:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="themes"><button data-t="vrg">VR GROUP</button><button data-t="corp">КОНФЕРЕНЦИЯ</button><button data-t="ny">НОВЫЙ ГОД</button><button data-t="auto">▶ АВТОПОКАЗ</button><button data-t="fs">⛶ НА ВЕСЬ ЭКРАН</button><a href="trailer.mp4" target="_blank" rel="noopener" style="all:unset;cursor:pointer;padding:7px 10px;border-radius:14px;color:rgba(241,236,226,.55);border:1px solid rgba(241,236,226,.18)">ТРЕЙЛЕР</a></div>
<div id="corner" aria-hidden="true"></div><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  const q = new URLSearchParams(location.search), stage = document.getElementById('stage');
  const cfg = window.AG_CONFIG || {}, base = location.href.split(/[?#]/)[0].replace(/[^/]*$/, '');
  const app = new AutographApp(stage, { theme: q.get('theme') || 'vrg', api: q.get('api') || cfg.api || '', fullUrl: cfg.fullUrl || base + 'full.html' });
  function fit() { const s = Math.min(innerWidth / 1280, innerHeight / 800); stage.style.transform = `scale(${s}) translate(-640px,-400px)`; }
  addEventListener('resize', fit); fit();
  const mark = () => document.querySelectorAll('#themes [data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === app.themeName));
  document.getElementById('themes').addEventListener('click', async e => {
    const t = e.target.dataset.t; if (!t) return;
    if (t === 'auto') { if (app.busy) return; if (app.state !== 'attract') await app.toAttract(); await app.start(900, 640); await app.autoSign(Math.floor(Math.random() * 3)); await app.autoDone(); return; }
    if (t === 'fs') { toggleFull(); return; }
    app.setTheme(t); mark();
  });

  // ── полный экран ──
  const de = document.documentElement, toast = document.getElementById('toast');
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  function say(t, ms = 4200) { toast.textContent = t; toast.classList.add('on'); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove('on'), ms); }
  let lock = null;
  async function keepAwake(on) {   // экран не гаснет, пока станция в полноэкранном режиме
    try { if (on && 'wakeLock' in navigator && !lock) lock = await navigator.wakeLock.request('screen'); if (!on && lock) { await lock.release(); lock = null; } } catch (e) {}
  }
  function kiosk(on) { document.body.classList.toggle('kiosk', on); keepAwake(on); fit(); }
  function toggleFull() {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    if (req) { Promise.resolve(req.call(de)).then(() => say('Полный экран. Панель спрятана: три быстрых касания в левом верхнем углу вернут её.')).catch(() => say('Браузер не дал открыть полный экран.')); }
    else say('Этот браузер не умеет полный экран. На iPad и iPhone: «Поделиться» → «На экран „Домой“» — станция откроется без панелей браузера.', 7000);
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(n => document.addEventListener(n, () => kiosk(!!fsEl() || standalone || q.has('kiosk'))));
  if (standalone || q.has('kiosk')) kiosk(true);
  // три быстрых касания в углу — показать или спрятать панель (в режиме стойки)
  let taps = [];
  document.getElementById('corner').addEventListener('pointerdown', () => {
    const now = Date.now(); taps = taps.filter(x => now - x < 900); taps.push(now);
    if (taps.length >= 3) { taps = []; document.body.classList.toggle('kiosk'); }
  });
  document.fonts.ready.then(() => { app.toAttract(); mark(); });
</script>
</body>
</html>
